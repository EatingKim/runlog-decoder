<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}</style>
<title>런 기록 해독기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=Gothic+A1:wght@400;600;800&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* 레이아웃: 위에 런 요약(시드가 제목), 왼쪽 좁은 칸 = 기록 코드 붙여넣기와 줄 검사,
   오른쪽 = 막·층을 따라 올라가는 런 지도. 좁은 화면에서는 위아래로 쌓음.
   한 가지 세계로 고정한 어두운 화면: 공허 동굴 바탕 + 게임 안 글자색(하급 흰·중급 파랑·상급 노랑·하자 붉은 보라·이벤트 청록) */
:root {
  color-scheme: dark;
  --ground: #131118; --rock: #1b1822; --seam: #2c2836; --dust: #8a8497; --bone: #ddd8e6;
  --void: #a48bff;
  --g0: #ece9f2; --g1: #6ea6ff; --g2: #f2d14b; --g3: #d65a86; --cyan: #5fd3cc;
  --elite: #ff9150; --boss: #ff5d5d; --camp: #ffb24d; --gold: #e3b04b; --ok: #79d39a; --warn: #f2b55c; --bad: #ff7b72;
  --f-display: "Orbit", "Gothic A1", sans-serif;
  --f-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "Nanum Gothic Coding", "D2Coding", Consolas, monospace;
}
html, body { background: var(--ground); }
body { color: var(--bone); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
pre, textarea, .mono { font-variant-ligatures: none; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 머리 */
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px;
  border-bottom: 1px solid var(--seam); padding-bottom: 10px; }
.brand { font-weight: 600; font-size: 0.92rem; color: var(--dust); }
.brand b { color: var(--bone); font-weight: 800; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-size: 0.85rem; color: var(--bone); background: transparent; border: 1px solid var(--seam);
  border-radius: 2px; padding: 5px 12px; cursor: pointer; }
button:hover { border-color: var(--void); color: var(--void); }
button.main { border-color: var(--void); color: var(--void); }
button.main:hover { background: var(--void); color: var(--ground); }
button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--void); outline-offset: 2px; }
.toast { font-size: 0.8rem; color: var(--ok); min-height: 1.3em; text-align: right; }

/* 런 요약 */
.hero { padding-block: 22px 18px; display: grid; gap: 6px; }
.seed { font-family: var(--f-display); font-size: clamp(1.3rem, 3.9vw, 2.2rem); /* 2026-11-07 사용자 "35% 줄여봐": 예전 clamp(2rem, 6vw, 3.4rem) */ line-height: 1.05; letter-spacing: 0.02em; margin: 0; }
.seed small { font-family: var(--f-body); font-weight: 600; font-size: 0.34em; color: var(--dust); margin-right: 0.6em; vertical-align: middle; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 0; padding: 0; list-style: none; color: var(--dust); font-size: 0.9rem; }
.facts b { color: var(--bone); font-weight: 600; font-variant-numeric: tabular-nums; }
.facts .lose b { color: var(--boss); } .facts .win b { color: var(--g2); }
.example { color: var(--warn); font-size: 0.82rem; margin: 0; }

/* 본문 */
.label { font-weight: 800; font-size: 0.78rem; letter-spacing: 0.04em; color: var(--dust); margin: 0 0 8px; }
textarea { width: 100%; box-sizing: border-box; min-height: calc(1.6em * 3 + 22px); resize: vertical; background: var(--rock); color: var(--bone);
  border: 1px solid var(--seam); border-radius: 2px; padding: 10px; font-family: var(--f-mono); font-size: 0.8rem; line-height: 1.6; }
/* 사진 올리기 (맨 위, 화면 폭 전체) */
.code-in { margin-top: 12px; }
.code-in .label { margin-bottom: 6px; }
.code-st { font-size: 0.82rem; color: var(--dust); margin-top: 6px; display: grid; gap: 2px; }
.code-st .ok { color: var(--ok); } .code-st .warn { color: var(--warn); } .code-st .bad { color: var(--bad); }
.code-in .label .dim { font-weight: 400; letter-spacing: 0; }
.upload { margin-top: 18px; border: 1px dashed var(--seam); background: var(--rock); padding: 16px; display: grid; gap: 14px; }
.upload.over { border-color: var(--void); }
.up-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.up-head p { margin: 0; color: var(--dust); font-size: 0.9rem; }
.up-head p b { color: var(--bone); font-weight: 600; }
.up-head label { color: var(--void); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.up-head input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.up-head label:focus-within { outline: 2px solid var(--void); outline-offset: 2px; }
.up-act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.go { background: var(--void); border-color: var(--void); color: var(--ground); font-weight: 800; padding: 7px 22px; font-size: 0.95rem; }
button.go:hover { filter: brightness(1.1); color: var(--ground); background: var(--void); }
button:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.thumbs .place { grid-column: 1 / -1; border: 1px dashed var(--seam); min-height: 120px; display: flex; align-items: center; justify-content: center; color: var(--dust); font-size: 0.9rem; text-align: center; padding: 12px; }
.thumb { background: var(--ground); border: 1px solid var(--seam); display: grid; grid-template-rows: auto auto; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.thumb .img { min-width: 0; aspect-ratio: 16 / 7; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb .bar2 { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 0.8rem; }
.thumb .ord { font-weight: 800; color: var(--bone); margin-right: auto; font-variant-numeric: tabular-nums; }
.thumb .nm { color: var(--dust); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.thumb button { padding: 2px 8px; font-size: 0.78rem; }
.empty-up { color: var(--dust); font-size: 0.85rem; margin: 0; }
.ocr-status { font-size: 0.8rem; color: var(--dust); min-height: 1.2em; }

/* 런 지도 */
.map { min-width: 0; display: grid; gap: 28px; margin-top: 8px; }
.act { display: grid; gap: 2px; }
.act-h { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--seam); padding-bottom: 6px; margin-bottom: 6px; }
.act-h h2 { font-weight: 800; font-size: 1.4rem; margin: 0; }
.act-h span { color: var(--dust); font-size: 0.85rem; }
.floor { display: grid; grid-template-columns: 2.2em 5.2em minmax(0, 1fr); gap: 4px 12px; padding: 7px 0; border-bottom: 1px dashed var(--seam); }
.floor:last-child { border-bottom: 0; }
.fn { font-family: var(--f-display); color: var(--dust); text-align: right; font-variant-numeric: tabular-nums; }
.room { font-weight: 600; font-size: 0.88rem; }
.room small { display: block; font-weight: 400; color: var(--dust); font-size: 0.72rem; }
.r1 { color: var(--g0); } .r2 { color: var(--elite); } .r3 { color: var(--boss); } .r4 { color: var(--camp); }
.r5 { color: var(--g2); } .r6 { color: var(--cyan); } .r7 { color: var(--gold); }
.items { display: grid; gap: 2px; min-width: 0; font-size: 0.88rem; }
.it { overflow-wrap: anywhere; }
.k { color: var(--dust); margin-right: 6px; }
.dim { color: var(--dust); }
.num { font-variant-numeric: tabular-nums; }
.hurt { color: var(--bad); }
.n0 { color: var(--g0); } .n1 { color: var(--g1); } .n2 { color: var(--g2); } .n3 { color: var(--g3); }
.ev { color: var(--cyan); } .gold { color: var(--gold); } .curse { color: var(--g3); }
.offer .sep { color: var(--seam); }
.offer .opt.on { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--void); }
.offer .opt:not(.on) span { color: var(--dust) !important; }
.stats { font-family: var(--f-mono); font-size: 0.76rem; color: var(--dust); }

/* 막 끝·런 끝 덱 */
.deck { margin-top: 10px; background: var(--rock); border: 1px solid var(--seam); padding: 12px 14px; display: grid; gap: 8px; }
.deck-h { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.85rem; color: var(--dust); }
.deck-h b { color: var(--bone); font-weight: 600; }
.deck-h .ttl { font-weight: 800; color: var(--bone); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
th.num { text-align: right; }
th { text-align: left; font-weight: 400; color: var(--dust); font-size: 0.72rem; letter-spacing: 0.06em; padding: 2px 10px 4px 0; white-space: nowrap; }
td { padding: 3px 10px 3px 0; vertical-align: top; border-top: 1px solid var(--seam); }
td.num { text-align: right; white-space: nowrap; }
td.mods { min-width: 16em; }
.end-list { font-size: 0.85rem; display: grid; gap: 2px; }
.warn-row { color: var(--warn); font-size: 0.85rem; padding: 8px 0; }

details.raw summary { cursor: pointer; color: var(--dust); font-size: 0.85rem; }
details.raw pre { background: var(--rock); border: 1px solid var(--seam); padding: 12px; font-family: var(--f-mono); font-size: 0.76rem;
  line-height: 1.6; overflow: auto; max-height: 60vh; color: var(--bone); }
.empty { color: var(--dust); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand">상실의 동굴 · <b>런 기록 해독기</b></div>
    <div class="tools">
      <button type="button" id="btn-check">코드 확인</button>
      <button type="button" id="btn-clear">지우기</button>
      <button type="button" class="main" id="btn-copy">AI용 글 복사</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <section class="upload" id="drop" aria-labelledby="up-title">
    <div class="up-head">
      <p id="up-title"><b>기록 화면 스크린샷</b>을 쪽 순서대로 끌어다 놓거나 붙여넣기(Ctrl+V), 또는 <label>파일 고르기<input type="file" id="file" accept="image/*" multiple></label></p>
      <div class="up-act">
        <button type="button" id="btn-unq" disabled>사진 모두 빼기</button>
        <button type="button" class="go" id="btn-go" disabled>변환</button>
      </div>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <span class="ocr-status" id="ocr-status" role="status"></span>
  </section>

  <div class="code-in">
    <p class="label">기록 코드 <span class="dim">· 변환하면 여기에 채워집니다. 구글 렌즈 등으로 뽑은 글을 붙였다면 위의 코드 확인을 누르세요</span></p>
    <textarea id="src" rows="4" spellcheck="false" autocomplete="off" aria-label="기록 코드"></textarea>
    <div class="code-st" id="code-st" role="status"></div>
  </div>

  <div class="hero" id="hero"></div>

  <main class="map" id="map"></main>
</div>

    if (d.length > LINE_SYMS) {
      res.status = 'bad';
      res.note = '글자 ' + d.length + '개 (72개보다 많음)';
      return res;
    }
    const wild = [];
    for (let i = 0; i < d.length; i++) if (!(d[i] in VAL)) wild.push(i);
    const kv = k in VAL ? VAL[k] : -1;
    const vals = Array.from(d, c => (c in VAL ? VAL[c] : 0));
    if (wild.length > 1) {
      res.status = 'bad';
      res.note = '읽지 못한 글자 ' + wild.length + '개 (자리 ' + wild.map(i => i + 1).join(', ') + ')';
      return res;
    }
    if (kv < 0) {
      if (wild.length === 0) {
        res.status = 'guess';
        res.note = '확인 글자를 읽지 못해 검사 못 함';
      } else {
        res.status = 'bad';
        res.note = '확인 글자와 다른 글자를 함께 읽지 못함';
      }
      return res;
    }
    if (wild.length === 1) {
      const p = wild[0];
      const need = (((kv - check(vals)) % 32) + 32) % 32; //vals[p]가 0일 때의 차이
      const inv = modInverse(2 * p + 1);
      const v = (need * inv) % 32;
      res.text = d.slice(0, p) + ALPHA[v] + d.slice(p + 1);
      res.status = 'fixed';
      res.note = (p + 1) + '번째 글자 ' + (line.seen ? line.seen[p] : d[p]) + ' → ' + ALPHA[v];
      return res;
    }
    if (check(vals) === kv) return res;
    /* 한 글자 잘못 읽음: 헷갈리는 짝 안에서 찾기 */
    const cands = [];
    for (let i = 0; i < d.length; i++) {
      for (const a of ALT[d[i]] || '') {
        if (!(a in VAL)) continue;
        const v2 = vals.slice();
        v2[i] = VAL[a];
        if (check(v2) === kv) cands.push({ text: d.slice(0, i) + a + d.slice(i + 1), note: (i + 1) + '번째 글자 ' + d[i] + ' → ' + a });
      }
    }
    for (const a of ALT[k] || '') {
      if (a in VAL && VAL[a] === check(vals)) cands.push({ text: d, note: '확인 글자 ' + k + ' → ' + a });
    }
    if (cands.length === 1) {
      res.text = cands[0].text;
      res.status = 'fixed';
      res.note = cands[0].note;
    } else if (cands.length > 1) {
      res.text = cands[0].text;
      res.status = 'guess';
      res.note = '고칠 후보 ' + cands.length + '개 중 첫째로 해독: ' + cands.map(c => c.note).join(' / ');
      res.alts = cands;
    } else {
      res.status = 'bad';
      res.note = '확인 글자가 안 맞음. 헷갈리는 짝으로 고쳐지지 않음 (두 글자 이상 틀렸을 수 있음)';
    }
    return res;
  }

  function modInverse(a) {
    for (let x = 1; x < 32; x += 2) if ((a * x) % 32 === 1) return x;
    return 1;
  }

  /* ---------- 비트 읽기 ---------- */
  function Reader(syms) {
    this.s = syms;
    this.p = 0;
    this.total = syms.length * 5;
  }
  Reader.prototype.left = function () { return this.total - this.p; };
  Reader.prototype.bits = function (n) {
    if (this.p + n > this.total) throw new Error('END');
    let v = 0;
    for (let k = 0; k < n; k++) {
      const q = this.p + k;
      v += ((this.s[(q / 5) | 0] >> (q % 5)) & 1) * Math.pow(2, k);
    }
    this.p += n;
    return v;
  };

  const ROOM = ['?', '일반', '엘리트', '우두머리', '모닥불', '상점', '이벤트', '보물'];
  const CAMP = { 1: '휴식', 2: '모듈 보상', 4: '단련', 5: '알 부화' };
  const SHOP = ['모듈 구매', '유물 구매', '하수인 구매', '물약 구매', '모듈 제거', '산 모듈 환불'];
  const GAIN = ['골드', '유물', '하수인', '물약', '저주'];
  const ENDING = ['패배', '일반 엔딩', '진 엔딩', '?'];
  const UPG = ['하수인공', '모듈공', '소환공', '방어'];

  function decodeSyms(syms, names) {
    names = names || {};
    const out = [];
    const ev = []; //화면용 구조 기록 (글 기록 out과 같은 순서)
    const r = new Reader(syms);
    const ver = r.bits(4);
    const W = {
      mod: ver >= 2 ? 9 : 7,
      relic: ver >= 3 ? 8 : 7,
      pot: ver >= 4 ? 6 : 5,
      min: ver >= 5 ? 6 : 5,
    };
    const useNames = names.version === ver;
    let problemAt = Infinity, ended = false;
    const odd = (cond, at) => { if (cond && problemAt === Infinity) problemAt = at; };
    const has = (table, v) => !useNames || !names[table] || (v > 0 && v < names[table].length && names[table][v] !== '');
    const nm = (table, v) => {
      if (!useNames || !names[table]) return String(v);
      const s = names[table][v];
      return s ? v + ' ' + s : String(v);
    };
    const seed = r.bits(20);
    const diff = r.bits(2);
    out.push('판 ' + ver + ' 시드 ' + seed + ' 난이도 ' + diff);
    ev.push({ type: 'head', ver, seed, diff, named: useNames });
    if (!useNames) out.push('(이름표는 판 ' + names.version + '용이라 번호만 적음)');
    if (ver < 2) out.push('(판 1 기록은 지원하지 않음)');
    let act = 1, floor = 0, lastVal = 0;
    const gainVal = (kind) => {
      const w = [10, W.relic, W.min, W.pot, 4][kind];
      const v = r.bits(w === undefined ? 4 : w);
      lastVal = v;
      const t = ['', 'relic', 'minion', 'potion', 'curse'][kind];
      return (GAIN[kind] || '종류' + kind) + ' ' + (t ? nm(t, v) : v);
    };
    const state = (ind) => {
      const st = { minions: [] };
      const hp = r.bits(10), mhp = r.bits(10), gold = r.bits(11);
      const up = [r.bits(5), r.bits(5), r.bits(5), r.bits(5)];
      const lim = r.bits(4), n = r.bits(4);
      Object.assign(st, { hp, mhp, gold, up, lim });
      out.push(ind + '체력 ' + hp + '/' + mhp + ' 골드 ' + gold + ' | 영구 업그레이드 ' + UPG.map((u, i) => u + up[i]).join(' ') + ' | 출전한도 ' + lim + ' 하수인 ' + n);
      for (let i = 0; i < n; i++) {
        const t = r.bits(W.min), bench = r.bits(1), h4 = r.bits(13), atk = r.bits(7), arm = r.bits(5), cd = r.bits(4);
        odd(!has('minion', t), r.p);
        const mods = [], modv = [];
        for (let k = 0; k < 4; k++) {
          const id = r.bits(W.mod);
          if (id === 0) { mods.push('-'); modv.push(null); continue; }
          const mv = { id, growth: 0, fuse: 0 };
          modv.push(mv);
          odd(!has('module', id), r.p);
          let s = nm('module', id);
          if (r.bits(1) === 1) {
            const g = r.bits(7), f = r.bits(W.mod);
            mv.growth = g;
            mv.fuse = f;
            if (g) s += ' 성장' + g;
            if (f) s += ' +합성 ' + nm('module', f);
          }
          mods.push(s);
        }
        st.minions.push({ t, bench, hp: h4 / 4, atk, arm, cd, mods: modv });
        out.push(ind + '  ' + nm('minion', t) + (bench ? ' (보관)' : '') + ' 체력+' + (h4 / 4) + ' 공+' + atk + ' 방+' + arm + ' 주기-' + cd + ' | ' + mods.join(' / '));
      }
      return st;
    };
    try {
      while (r.left() >= 4) {
        const at = r.p;
        const tag = r.bits(4);
        const P = '[' + at + '] ';
        if (tag === 0) { odd(r.left() >= 5, at); break; }
        if (tag === 1) {
          const lane = r.bits(1), type = r.bits(3), atk = r.bits(8), hp = r.bits(ver >= 2 ? 12 : 10);
          let tail = '';
          if (ver >= 2) tail = ' 방' + r.bits(8) + ' 수' + r.bits(4);
          floor += 1;
          odd(type === 0 || floor > 15, at);
          ev.push({ type: 'room', at, act, floor, lane, room: type, atk, hp });
          out.push(P + '=== ' + act + '막 ' + floor + '층 방 길' + (lane ? 'B' : 'A') + ' ' + (ROOM[type] || type) + ' | 덱 공' + atk + ' 체' + hp + tail);
        } else if (tag === 2) {
          const enc = r.bits(7), lost = r.bits(8), t = r.bits(6);
          odd(useNames && enc >= names.encounter.length, at);
          ev.push({ type: 'battle', at, enc, lost, sec: t * 10 });
          out.push(P + '전투 승리 편성' + nm('encounter', enc) + ' 잃은체력' + lost + ' 시간' + t * 10 + '초');
        } else if (tag === 3) {
          const kind = r.bits(1), n = r.bits(3), w = kind ? W.min : W.mod;
          const ids = [], idv = [];
          odd(n === 0 || n > 4, at);
          for (let i = 0; i < n; i++) { const v = r.bits(w); odd(!has(kind ? 'minion' : 'module', v), at); ids.push(nm(kind ? 'minion' : 'module', v)); idv.push(v); }
          ev.push({ type: 'offer', at, kind, ids: idv });
          out.push(P + '후보 ' + (kind ? '하수인' : '모듈') + ' [' + ids.join(', ') + ']');
        } else if (tag === 4) {
          const kind = r.bits(1), idx = r.bits(3);
          ev.push({ type: 'pick', at, kind, idx });
          out.push(P + '고름 ' + (kind ? '하수인' : '모듈') + ' ' + idx + '번째');
        } else if (tag === 5 || tag === 6) {
          const gk = r.bits(3);
          odd(gk > 4, at);
          const gv = gainVal(gk);
          odd(gk > 0 && gk < 5 && !has(['', 'relic', 'minion', 'potion', 'curse'][gk], lastVal), at);
          out.push(P + (tag === 5 ? '얻음 ' : '잃음 ') + gv);
          ev.push({ type: tag === 5 ? 'gain' : 'lose', at, kind: gk, v: lastVal });
        } else if (tag === 7) {
          const evId = r.bits(6);
          odd(!has('event', evId), at);
          ev.push({ type: 'event', at, id: evId });
          out.push(P + '이벤트 ' + nm('event', evId));
        } else if (tag === 8) {
          const ch = r.bits(2);
          ev.push({ type: 'choice', at, c: ch + 1 });
          out.push(P + '선택지 (' + (ch + 1) + ')');
        } else if (tag === 9) {
          const pot = r.bits(1);
          const pv = r.bits(pot ? W.pot : W.mod);
          ev.push({ type: 'evpick', at, pot, v: pv });
          out.push(P + '이벤트에서 고름 ' + (pot ? '물약 ' + nm('potion', pv) : '모듈 ' + nm('module', pv)));
        } else if (tag === 10) {
          const cat = r.bits(3);
          odd(cat > 5, at);
          if (cat === 5) { ev.push({ type: 'shop', at, cat }); out.push(P + '상점 산 모듈 환불'); continue; }
          const id = r.bits(W.mod), price = r.bits(9);
          ev.push({ type: 'shop', at, cat, id, price });
          const t = ['module', 'relic', 'minion', 'potion', 'module'][cat];
          out.push(P + '상점 ' + (SHOP[cat] || cat) + ' ' + (t ? nm(t, id) : id) + ' 가격' + price);
        } else if (tag === 11) {
          const c = r.bits(3);
          odd(!(c in CAMP), at);
          ev.push({ type: 'camp', at, c });
          out.push(P + '모닥불 ' + (CAMP[c] || c));
        } else if (tag === 12) {
          const pk = r.bits(W.pot);
          odd(!has('potion', pk), at);
          ev.push({ type: 'potion', at, v: pk });
          out.push(P + '물약 사용 ' + nm('potion', pk));
        } else if (tag === 13) {
          out.push(P + '##### ' + act + '막 끝');
          ev.push({ type: 'act', at, act, state: state('    ') });
          act += 1;
          floor = 0;
        } else if (tag === 14) {
          const ending = r.bits(2), enc = r.bits(7), score = r.bits(13), kills = r.bits(10);
          odd(ending > 2, at);
          const endEv = { type: 'end', at, ending, enc, score, kills };
          ev.push(endEv);
          out.push(P + '##### 런 끝: ' + ENDING[ending] + ' 마지막 편성' + nm('encounter', enc) + ' 점수' + score + ' 처치' + kills);
          endEv.state = state('    ');
          const nr = r.bits(8), rel = [];
          endEv.relics = [];
          for (let i = 0; i < nr; i++) { const rv = r.bits(W.relic); endEv.relics.push(rv); rel.push(nm('relic', rv)); }
          out.push('    유물 ' + nr + '개: ' + rel.join(', '));
          const cur = [];
          endEv.curses = [];
          for (let k = 1; k <= 10; k++) { const c = r.bits(3); if (c) { cur.push(nm('curse', k) + '×' + c); endEv.curses.push({ id: k, n: c }); } }
          out.push('    저주: ' + (cur.join(', ') || '없음'));
          const np = r.bits(3), pots = [];
          endEv.potions = [];
          for (let i = 0; i < np; i++) { const pv2 = r.bits(W.pot); endEv.potions.push(pv2); pots.push(nm('potion', pv2)); }
          out.push('    물약 칸 ' + np + ': ' + pots.join(', '));
          ended = true;
          odd(r.left() >= 10, r.p);
          break;
        } else if (tag === 15) {
          const slot = r.bits(4), t = r.bits(W.min);
          odd(slot > 11 || !(t === 0 || has('minion', t)), at);
          if (t === 0) { ev.push({ type: 'stat', at, slot, t: 0 }); out.push(P + '  칸' + slot + ' 비어 있음'); continue; }
          const h4 = r.bits(13), atk = r.bits(7), arm = r.bits(5), cd = r.bits(4);
          ev.push({ type: 'stat', at, slot, t, hp: h4 / 4, atk, arm, cd });
          out.push(P + '  칸' + slot + ' ' + nm('minion', t) + ' 체력+' + (h4 / 4) + ' 공+' + atk + ' 방+' + arm + ' 주기-' + cd);
        }
      }
    } catch (e) {
      if (e.message !== 'END') throw e;
      out.push('(기록이 여기서 끊김: 글자가 모자람)');
      ev.push({ type: 'cut' });
    }
    out.ev = ev;
    out.problemAt = problemAt;
    out.ended = ended;
    return out;
  }

  /* 전체: 글 → {lines: 줄별 결과, log: 해독 줄들, ok} */
  /* 후보가 여럿인 줄: 후보마다 뒤 줄까지 붙여 해독해 보고, 이상한 기록이 가장 늦게 나오는 후보를 고름 */
  function score(syms, names) {
    let o;
    try { o = decodeSyms(syms, names); } catch (e) { return -1; }
    return o.problemAt === Infinity ? syms.length * 5 + (o.ended ? 1 : 0) : o.problemAt;
  }
  function pickByDecode(fixed, names) {
    const symsOf = t => Array.from(t, c => (c in VAL ? VAL[c] : 0));
    for (let i = 0; i < fixed.length; i++) {
      const f = fixed[i];
      if (f.status !== 'guess' || !f.alts.length) continue;
      const before = [].concat(...fixed.slice(0, i).map(x => symsOf(x.text)));
      const after = [].concat(...fixed.slice(i + 1).map(x => symsOf(x.text)));
      const scored = f.alts.map(c => ({ c, s: score(before.concat(symsOf(c.text), after), names) }));
      scored.sort((a, b) => b.s - a.s);
      const best = scored[0];
      const tied = scored.filter(x => x.s === best.s);
      f.text = best.c.text;
      if (tied.length === 1) {
        f.status = 'fixed';
        f.note = best.c.note + ' (후보 ' + scored.length + '개 중 해독이 맞는 것)';
      } else {
        f.note = '후보 ' + tied.length + '개가 똑같이 그럴듯함. ' + best.c.note + '로 해독함. 다른 후보: ' + tied.slice(1).map(x => x.c.note).join(' / ');
      }
    }
  }

  function decodeText(text, names) {
    const lines = splitLines(text);
    const fixed = lines.map((l, i) => repairLine(l, i === lines.length - 1));
    if (names && names.version) pickByDecode(fixed, names);
    const syms = [];
    let stopAt = -1;
    for (const f of fixed) {
      if (f.status === 'bad') { stopAt = f.n; break; }
      for (const c of f.text) syms.push(VAL[c]);
    }
    let log = [];
    if (syms.length) log = decodeSyms(syms, names);
    if (stopAt > 0) { if (log.ev) log.ev.push({ type: 'stop', line: stopAt }); log.push('(' + stopAt + '번째 줄을 고치지 못해 그 앞까지만 해독함)'); }
    return { lines: fixed, log: log, ev: log.ev || [], stopAt: stopAt, ok: stopAt < 0 && fixed.every(f => f.status !== 'guess') };
  }

  const api = { ROOM, CAMP, SHOP, GAIN, ENDING, UPG, ALPHA, LINE_SYMS, check, splitLines, repairLine, decodeSyms, decodeText };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.RunLogDecode = api;

  if (typeof require !== 'undefined' && typeof module !== 'undefined' && require.main === module) {
    const fs = require('fs'), path = require('path');
    const file = process.argv[2];
    const text = fs.readFileSync(file && file !== '-' ? file : 0, 'utf8');
    let names = {};
    try { names = JSON.parse(fs.readFileSync(path.join(__dirname, 'names.json'), 'utf8')); } catch (e) { /* 이름표 없으면 번호만 */ }
    const res = decodeText(text, names);
    for (const l of res.lines) if (l.status !== 'ok') console.log('줄 ' + l.n + ' [' + l.status + '] ' + l.note);
    console.log(res.log.join('\n'));
  }
})(this);

<script>
/* 사진 → 기록 코드 글 (2026-11-07): 게임 글꼴 본 맞추기 판독기. 브라우저·node 공용 (그림은 {w, h, data: RGBA} 로 받음)
 * 범용 글자 인식(Tesseract)은 이 글꼴에서 줄마다 여러 글자를 틀려 확인 글자로도 못 고침 → 글자 본(모양)을 화면에 맞춰 봄
 * 1) 밝기 = r·g·b 중 가장 큰 값 (흰·노랑·파랑 글자 모두 밝게). 밝은 바탕이면 뒤집음
 * 2) 글자 줄 찾기: 잉크가 있는 가로 띠. 띠마다 바닥선(글자 아래 끝)을 잼
 * 3) 줄마다 동적 계획법: 왼쪽부터 "빈 칸 한 칸 건너뛰기" 또는 "글자 본 하나 놓기"로 줄 전체를 가장 적은 차이로 덮는 길을 찾음
 *    붙어 있는 글자(K와 W 등)도 본 폭대로 나뉨. 글자 사이가 넓으면 공백 (확인 글자 앞)
 * 4) 본: 글자마다 바닥선 기준 높이 H의 밝기 격자 (H = 본을 뽑은 사진의 글자 높이). 다른 크기의 사진은 줄 높이 비율로 늘이거나 줄여서 맞춤
 * 시험 (실제 기록 화면 한 줄, 2026-11-07): 같은 크기 스크린샷은 한 글자도 안 틀림. 0.75배·1.4배·JPEG는 한 줄에 1~6글자, 흐린 사진·기운 휴대폰 사진은 거의 못 읽음 */
(function (root) {
  'use strict';
  const ALPHA = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  const INK = 0.35;

  function toGray(img) {
    const n = img.w * img.h, g = new Float32Array(n), d = img.data;
    let sum = 0;
    for (let i = 0; i < n; i++) { const v = Math.max(d[4 * i], d[4 * i + 1], d[4 * i + 2]) / 255; g[i] = v; sum += v; }
    if (sum / n > 0.5) for (let i = 0; i < n; i++) g[i] = 1 - g[i]; //밝은 바탕
    /* 명암 맞추기: 바탕(중앙값) → 0, 글자 획 안쪽 밝기(바탕보다 확실히 밝은 화소의 90%) → 1. 글자 양과 상관없이 같은 밝기가 되게 */
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) hist[Math.min(255, (g[i] * 255) | 0)]++;
    let c0 = 0, bgv = 0;
    for (let v = 0; v < 256; v++) { c0 += hist[v]; if (c0 >= n / 2) { bgv = v; break; } }
    const lo = Math.min(255, bgv + 60);
    let inkN = 0;
    for (let v = lo; v < 256; v++) inkN += hist[v];
    let c1 = 0, fgv = 255;
    for (let v = lo; v < 256; v++) { c1 += hist[v]; if (c1 >= inkN * 0.9) { fgv = v; break; } }
    const bg = bgv / 255, fg = Math.max(bg + 0.2, fgv / 255);
    for (let i = 0; i < n; i++) g[i] = Math.max(0, Math.min(1, (g[i] - bg) / (fg - bg)));
    const im = { w: img.w, h: img.h, g, tan: 0 };
    im.tan = skew(im);
    return im;
  }
  /* 기울기: 가로줄 잉크 합의 분산이 가장 큰 각도 (−3°~3°, 0.1°씩). 줄이 수평일 때 줄과 줄 사이가 가장 또렷함 */
  function skew(im) {
    const step = Math.max(1, Math.round(im.w / 800)), pts = [];
    for (let y = 0; y < im.h; y += step) for (let x = 0; x < im.w; x += step) if (im.g[y * im.w + x] > 0.5) pts.push(x, y);
    if (pts.length < 40) return 0;
    let bestT = 0, bestV = -1;
    for (let a = -3; a <= 3.0001; a += 0.1) {
      const t = Math.tan(a * Math.PI / 180), rows = new Float64Array(im.h + im.w);
      for (let i = 0; i < pts.length; i += 2) { const y = Math.round(pts[i + 1] - pts[i] * t) + im.w; if (y >= 0 && y < rows.length) rows[y]++; }
      let v = 0; for (let i = 0; i < rows.length; i++) v += rows[i] * rows[i];
      if (v > bestV) { bestV = v; bestT = t; }
    }
    return bestT;
  }

  /* 글자 줄: [{top, base, x0, x1}] (base = 글자 아래 끝 + 1) */
  function findLines(im) {
    const { w, h, g } = im, rows = new Float32Array(h);
    for (let y = 0; y < h; y++) { let s = 0; for (let x = 0; x < w; x++) if (pxd(im, x, y) > INK) s++; rows[y] = s; }
    const bands = [];
    let s = -1;
    for (let y = 0; y <= h; y++) {
      const on = y < h && rows[y] > 2;
      if (on && s < 0) s = y;
      if (!on && s >= 0) { if (y - s >= 8) bands.push([s, y]); s = -1; }
    }
    return bands.map(([t, b]) => {
      let peak = 0;
      for (let y = t; y < b; y++) peak = Math.max(peak, rows[y]);
      let base = b; //바닥선: 위에서부터 진한 줄의 마지막 (Q 꼬리 같은 삐침 빼고)
      for (let y = b - 1; y >= t; y--) if (rows[y] > peak * 0.3) { base = y + 1; break; }
      let x0 = w, x1 = 0;
      for (let y = t; y < b; y++) for (let x = 0; x < w; x++) if (pxd(im, x, y) > INK) { if (x < x0) x0 = x; if (x > x1) x1 = x; }
      return { top: t, bottom: b, base, x0, x1: x1 + 1 };
    });
  }

  /* 줄 띠를 바닥선 기준 높이 H, 가로 비율 sx로 뽑은 격자 (위로 H-pad, 아래로 pad) */
  function bandGrid(im, line, H, scale) {
    const capH = line.base - line.top;
    const s = scale || (capH / H); //원본 px / 격자 px
    const pad = Math.round(H * 0.2);
    const GH = H + pad;
    const GW = Math.ceil((line.x1 - line.x0 + 4) / s);
    const out = new Float32Array(GW * GH);
    for (let gy = 0; gy < GH; gy++) {
      const sy = line.base - (H - gy) * s;
      for (let gx = 0; gx < GW; gx++) {
        const sx = line.x0 - 2 + gx * s;
        out[gy * GW + gx] = sample(im, sx, sy, s);
      }
    }
    return { w: GW, h: GH, g: out, s, x0: line.x0 - 2 };
  }
  function sample(im, x, y, s) { //s×s 칸의 평균 (줄일 때) 또는 쌍선형 (늘릴 때)
    if (s > 1.2) {
      let sum = 0, n = 0;
      for (let yy = Math.floor(y); yy < y + s; yy++) for (let xx = Math.floor(x); xx < x + s; xx++) { sum += pxd(im, xx, yy); n++; }
      return n ? sum / n : 0;
    }
    const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
    const yt = y + x * im.tan, yy0 = Math.floor(yt), fy2 = yt - yy0;
    return px(im, x0, yy0) * (1 - fx) * (1 - fy2) + px(im, x0 + 1, yy0) * fx * (1 - fy2) + px(im, x0, yy0 + 1) * (1 - fx) * fy2 + px(im, x0 + 1, yy0 + 1) * fx * fy2;
  }
  function px(im, x, y) { return x < 0 || y < 0 || x >= im.w || y >= im.h ? 0 : im.g[y * im.w + x]; }
  /* 바로잡은 좌표 (x, y) → 원본 화소. y는 기울기만큼 비켜 읽음 */
  function pxd(im, x, y) { return px(im, x, Math.round(y + x * im.tan)); }

  /* 본 모음: { H, chars: {글자: {w, g: Float32Array(w*GH)}} } */
  /* 세로줄 하나를 빈 칸으로 볼 때의 값 = 그 줄 밝기 제곱의 합 (글자 본을 맞출 때와 같은 잣대) */
  function colBlank(grid) {
    const c = new Float32Array(grid.w);
    for (let x = 0; x < grid.w; x++) { let s = 0; for (let y = 0; y < grid.h; y++) { const v = grid.g[y * grid.w + x]; s += v * v; } c[x] = s; }
    return c;
  }
  function colInk(grid) {
    const c = new Float32Array(grid.w);
    for (let x = 0; x < grid.w; x++) { let m = 0; for (let y = 0; y < grid.h; y++) m = Math.max(m, grid.g[y * grid.w + x]); c[x] = m; }
    return c;
  }

  /* 동적 계획법으로 한 줄 읽기 */
  function readGrid(grid, T) {
    const W = grid.w, GH = grid.h, chars = Object.keys(T.chars);
    const ink = colInk(grid), blank = colBlank(grid);
    const best = new Float64Array(W + 1).fill(Infinity), from = new Int32Array(W + 1), what = new Array(W + 1);
    best[0] = 0;
    const PEN = 0.6; //글자 하나 놓는 값 (작은 글자로 잘게 쪼개지 않게)
    for (let x = 0; x < W; x++) {
      if (best[x] === Infinity) continue;
      const skip = best[x] + blank[x]; //빈 칸으로 보고 건너뜀
      if (skip < best[x + 1]) { best[x + 1] = skip; from[x + 1] = x; what[x + 1] = null; }
      if (ink[x] < INK * 0.5) continue; //글자는 잉크가 시작되는 칸에서만 시작
      for (const c of chars) {
        const t = T.chars[c], tw = t.w;
        if (x + tw > W) continue;
        const d = diffAt(grid, x, t);
        const v = best[x] + d + PEN;
        const end = x + tw;
        if (v < best[end]) { best[end] = v; from[end] = x; what[end] = c; }
      }
    }
    const seq = [];
    for (let x = W; x > 0; x = from[x]) if (what[x]) seq.push({ c: what[x], x0: from[x], x1: x });
    seq.reverse();
    /* 글자 사이가 평균 글자 폭의 절반보다 넓으면 공백 */
    const avg = seq.reduce((a, s) => a + (s.x1 - s.x0), 0) / Math.max(1, seq.length);
    let out = '';
    seq.forEach((s, i) => { if (i && s.x0 - seq[i - 1].x1 > avg * 0.5) out += ' '; out += s.c; });
    /* 글자마다 다른 후보: 같은 자리에 다른 본을 놓았을 때 차이가 얼마나 더 큰지 (작을수록 헷갈리는 글자) */
    for (const q of seq) {
      const mine = diffAt(grid, q.x0, T.chars[q.c]);
      q.alts = [];
      for (const c of chars) {
        if (c === q.c) continue;
        const t = T.chars[c];
        if (q.x0 + t.w > W) continue;
        let d = diffAt(grid, q.x0, t);
        for (let x = q.x0 + t.w; x < q.x1; x++) d += blank[x]; //더 좁은 글자면 남는 칸은 빈 칸으로
        q.alts.push({ c, delta: d - mine });
      }
      q.alts.sort((a, b) => a.delta - b.delta);
      q.alts.length = Math.min(3, q.alts.length);
    }
    return { text: out, seq, cost: best[W] / Math.max(1, seq.length) }; //cost: 글자 하나당 평균 차이 (한글 같은 다른 글은 큼)
  }

  /* 확인 글자로 고치기: 줄 = 글자들 + 공백 + 확인 글자.
   * 맞게 읽은 글자의 2순위 후보는 거의 다 차이(delta) 5 이상, 잘못 읽은 글자의 정답은 대부분 9 미만 (실제 화면 16줄 시험, 2026-11-07)
   * → 차이 9 미만 후보만 써서 확인 글자가 맞는 방법이 딱 하나일 때만 고침. 여러 개면 고치지 않고 표시 (틀린 줄이 확인을 통과하지 않게) */
  const ALT_MAX = 9;
  const SURE = 5; //2순위 후보와의 차이가 이보다 작은 글자는 "자신 없음"
  function weakOf(r, changed) {
    const w = [];
    r.seq.forEach((q, i) => { if (changed.has(i) || (q.alts[0] && q.alts[0].delta < SURE)) w.push(i); });
    return w;
  }
  function chk(vals) { let s = 0; vals.forEach((v, i) => { s += v * (2 * i + 1); }); return s % 32; }
  function fixLine(r) {
    const n = r.seq.length - 1; //마지막은 확인 글자
    if (r.text.lastIndexOf(' ') < 0 || n < 1) return { text: r.text, fixed: 0, weak: weakOf(r, new Set()) };
    const vals = r.seq.map(q => ALPHA.indexOf(q.c));
    const ok = v => chk(v.slice(0, n)) === v[n];
    if (ok(vals)) return { text: r.text, fixed: 0, weak: weakOf(r, new Set()) };
    const opts = [];
    r.seq.forEach((q, i) => q.alts.forEach(a => { if (a.delta < ALT_MAX) opts.push({ i, c: a.c, d: a.delta }); }));
    const sols = [];
    for (const o of opts) { const v = vals.slice(); v[o.i] = ALPHA.indexOf(o.c); if (ok(v)) sols.push([o]); }
    if (!sols.length && opts.length <= 8) {
      for (let a = 0; a < opts.length; a++) for (let b = a + 1; b < opts.length; b++) {
        if (opts[a].i === opts[b].i) continue;
        const v = vals.slice(); v[opts[a].i] = ALPHA.indexOf(opts[a].c); v[opts[b].i] = ALPHA.indexOf(opts[b].c);
        if (ok(v)) sols.push([opts[a], opts[b]]);
      }
    }
    if (sols.length !== 1) return { text: r.text, fixed: sols.length ? -sols.length : -1, weak: weakOf(r, new Set()) }; //못 고침 (음수 = 후보 수)
    const cs = r.seq.map(q => q.c);
    sols[0].forEach(o => { cs[o.i] = o.c; });
    return { text: cs.slice(0, n).join('') + ' ' + cs[n], fixed: sols[0].length, weak: weakOf(r, new Set(sols[0].map(o => o.i))) };
  }

  /* 정답을 아는 줄에서 처음 본 뽑기: 빈 칸으로 덩어리를 나누고, 덩어리마다 글자 몇 개를 맡는지 폭으로 정함.
   * 붙은 덩어리를 나눈 조각은 경계가 어긋나기 쉬워서, 한 글자만 맡은 덩어리에서만 본을 뜸. 이미 아는 글자는 그대로 둠
   * 그다음 refine(강제 정렬)으로 모든 줄에서 본을 다듬음 */
  function harvest(im, line, text, T) {
    T = T || { H: line.base - line.top, chars: {} }; //본 높이 = 이 사진의 글자 높이
    const grid = bandGrid(im, line, T.H);
    const ink = colInk(grid);
    const segs = [];
    let s0 = -1;
    for (let x = 0; x <= grid.w; x++) {
      const on = x < grid.w && ink[x] > INK * 0.6;
      if (on && s0 < 0) s0 = x;
      if (!on && s0 >= 0) { segs.push([s0, x]); s0 = -1; }
    }
    const chars = text.replace(/ /g, '').split('');
    const singles = segs.map(q => q[1] - q[0]).filter(v => v > 3).sort((p, q) => p - q);
    const med = singles[Math.floor(singles.length / 2)];
    const wid = {};
    chars.forEach(c => { wid[c] = T.chars[c] ? T.chars[c].w : med; });
    let assign = null;
    for (let round = 0; round < 3; round++) {
      const nS = segs.length, nC = chars.length, INF = 1e18;
      const dp = Array.from({ length: nS + 1 }, () => new Float64Array(nC + 1).fill(INF)), back = Array.from({ length: nS + 1 }, () => new Int8Array(nC + 1));
      dp[0][0] = 0;
      for (let i = 0; i < nS; i++) for (let j = 0; j <= nC; j++) {
        if (dp[i][j] === INF) continue;
        let sum = 0;
        for (let k = 1; k <= 4 && j + k <= nC; k++) {
          sum += wid[chars[j + k - 1]];
          const e = (segs[i][1] - segs[i][0]) - sum;
          const v = dp[i][j] + e * e;
          if (v < dp[i + 1][j + k]) { dp[i + 1][j + k] = v; back[i + 1][j + k] = k; }
        }
      }
      if (dp[nS][nC] === INF) return { T, ok: false, got: nS, want: nC };
      assign = [];
      for (let i = nS, j = nC; i > 0; i--) { const k = back[i][j]; assign.unshift(k); j -= k; }
      const meas = {};
      let j = 0;
      assign.forEach((k, i) => { if (k === 1 && !T.chars[chars[j]]) (meas[chars[j]] = meas[chars[j]] || []).push(segs[i][1] - segs[i][0]); j += k; });
      for (const c in meas) wid[c] = meas[c].reduce((a, v) => a + v, 0) / meas[c].length;
    }
    /* 조각 나누기: 붙은 덩어리는 글자 폭 비율로 나누고 그 근처에서 잉크가 가장 옅은 세로줄에서 가름 */
    const pieces = [];
    let ci = 0;
    assign.forEach((k, i) => {
      const [a, b] = segs[i], part = chars.slice(ci, ci + k), tot = part.reduce((u, c) => u + wid[c], 0);
      let st = a, acc0 = a;
      for (let q = 0; q < k - 1; q++) {
        acc0 += wid[part[q]] * (b - a) / tot;
        const guess = Math.round(acc0), r = Math.max(2, Math.round(med * 0.3));
        let cut = guess, mv = Infinity;
        for (let x = guess - r; x <= guess + r; x++) if (x > st && x < b && ink[x] < mv) { mv = ink[x]; cut = x; }
        pieces.push({ a: st, b: cut, c: part[q], alone: false });
        st = cut;
      }
      pieces.push({ a: st, b, c: part[k - 1], alone: k === 1 });
      ci += k;
    });
    /* 홀로 선 글자가 있으면 그것만, 없으면 나눈 조각으로 (뒤에 refine이 다듬음). 이미 아는 글자는 그대로 */
    const hasAlone = {};
    pieces.forEach(p => { if (p.alone) hasAlone[p.c] = 1; });
    const acc = {};
    for (const p of pieces) {
      if (T.chars[p.c] || (hasAlone[p.c] && !p.alone)) continue;
      const w = p.b - p.a, g = new Float32Array(w * grid.h);
      for (let y = 0; y < grid.h; y++) for (let q = 0; q < w; q++) g[y * w + q] = grid.g[y * grid.w + p.a + q];
      (acc[p.c] = acc[p.c] || []).push({ w, g });
    }
    for (const c in acc) { //같은 글자는 가장 흔한 폭의 것들을 평균
      const cnt = {};
      acc[c].forEach(o => { cnt[o.w] = (cnt[o.w] || 0) + 1; });
      const mode = +Object.keys(cnt).sort((p, q) => cnt[q] - cnt[p])[0];
      const same = acc[c].filter(o => o.w === mode), g = new Float32Array(same[0].g.length);
      same.forEach(o => o.g.forEach((v, i) => { g[i] += v / same.length; }));
      T.chars[c] = { w: mode, g };
    }
    return { T, ok: true };
  }

  /* 글자 본과 그림 칸의 차이 (위아래 1칸 어긋남 허용) */
  function diffAt(grid, x, t) {
    const W = grid.w, GH = grid.h, tw = t.w;
    let d = Infinity;
    for (let dy = -1; dy <= 1; dy++) {
      let dd = 0;
      for (let y = 0; y < GH; y++) {
        const yy = y + dy, to = y * tw;
        if (yy < 0 || yy >= GH) { for (let k = 0; k < tw; k++) dd += t.g[to + k] * t.g[to + k]; continue; }
        const ro = yy * W + x;
        for (let k = 0; k < tw; k++) { const e = grid.g[ro + k] - t.g[to + k]; dd += e * e; }
      }
      if (dd < d) d = dd;
    }
    return d;
  }

  /* 정답 순서를 아는 줄을 본으로 맞춰 글자마다 [시작, 끝] 칸을 찾음 (강제 정렬) */
  function align(grid, chars, T) {
    const W = grid.w, n = chars.length, blank = colBlank(grid), INF = 1e18;
    const best = Array.from({ length: n + 1 }, () => new Float64Array(W + 1).fill(INF));
    const back = Array.from({ length: n + 1 }, () => new Int8Array(W + 1)); //1 = 빈 칸, 2 = 글자
    best[0][0] = 0;
    for (let x = 0; x < W; x++) for (let j = 0; j <= n; j++) {
      const b = best[j][x];
      if (b === INF) continue;
      const skip = b + blank[x];
      if (skip < best[j][x + 1]) { best[j][x + 1] = skip; back[j][x + 1] = 1; }
      if (j < n) {
        const t = T.chars[chars[j]];
        if (!t || x + t.w > W) continue;
        const v = b + diffAt(grid, x, t);
        if (v < best[j + 1][x + t.w]) { best[j + 1][x + t.w] = v; back[j + 1][x + t.w] = 2; }
      }
    }
    if (best[n][W] === INF) return null;
    const out = [];
    for (let j = n, x = W; x > 0;) {
      if (back[j][x] === 2) { const w = T.chars[chars[j - 1]].w; out.unshift([x - w, x]); x -= w; j--; } else x--;
    }
    return out;
  }

  /* 정렬로 다시 본 뜨기: 여러 줄 [{im, line, text}] 를 몇 번 돌려 본을 다듬음.
   * 정렬로 글자마다 시작 칸을 얻고, 다음 글자 시작 전까지에서 잉크가 있는 범위를 재서 폭도 다시 정함 (처음 폭이 틀려도 바로잡힘) */
  function refine(samples, T, rounds) {
    for (let r = 0; r < (rounds || 3); r++) {
      const occ = {};
      for (const sm of samples) {
        const grid = bandGrid(sm.im, sm.line, T.H);
        const chars = sm.text.replace(/ /g, '').split('');
        const pieces = align(grid, chars, T);
        if (!pieces) continue;
        const ink = colInk(grid);
        pieces.forEach(([a, b], i) => {
          const lim = i + 1 < pieces.length ? pieces[i + 1][0] : Math.min(grid.w, b + 4);
          let rr = -1;
          for (let x = a; x < lim; x++) if (ink[x] > INK * 0.3) rr = x;
          if (rr < 0) return;
          (occ[chars[i]] = occ[chars[i]] || []).push({ grid, l: a, w: rr - a + 1 }); //기준점 = 정렬된 시작 칸 (판독할 때와 같게)
        });
      }
      for (const c in occ) {
        const ws = occ[c].map(o => o.w).sort((p, q) => p - q), w = ws[ws.length >> 1]; //폭 = 중앙값
        const list = occ[c].map(o => {
          const g = new Float32Array(w * o.grid.h);
          for (let y = 0; y < o.grid.h; y++) for (let k = 0; k < w; k++) g[y * w + k] = o.grid.g[y * o.grid.w + o.l + k] || 0;
          return g;
        });
        const len = list[0].length, g = new Float32Array(len), tmp = new Float32Array(list.length);
        for (let i = 0; i < len; i++) { list.forEach((q, k) => { tmp[k] = q[i]; }); tmp.sort(); g[i] = tmp[tmp.length >> 1]; }
        T.chars[c] = { w, g };
      }
    }
    return T;
  }

    if (end && end.state) {
      const extra = '<div class="end-list">' +
        '<div><span class="k">유물 ' + end.relics.length + '</span>' + (end.relics.map(v => nm('relic', v)).join(', ') || '<span class="dim">없음</span>') + '</div>' +
        '<div><span class="k">저주</span>' + (end.curses.map(c => nm('curse', c.id) + ' <span class="dim num">×' + c.n + '</span>').join(', ') || '<span class="dim">없음</span>') + '</div>' +
        '<div><span class="k">물약</span>' + (end.potions.map(v => nm('potion', v)).join(', ') || '<span class="dim">없음</span>') + '</div></div>';
      h += '<section class="act"><div class="act-h"><h2>런 끝</h2><span>' + D.ENDING[end.ending] + ' · 마지막 전투 ' + encName(end.enc) + '</span></div>' + deckBlock('남은 덱', end.state, extra) + '</section>';
    }
    for (const w of warn) h += '<div class="warn-row">' + esc(w) + '</div>';
    h += '<details class="raw"><summary>글로 보기 (AI에 넘기는 글)</summary><pre>' + esc(lastLog) + '</pre></details>';
    return { html: h, head, end, acts };
  }
  function encName(id) { return '<span>' + esc((named && N.encounter[id]) || '편성 ' + id) + '</span>'; }
  function item(e) {
    switch (e.type) {
      case 'battle': return '<span class="k">전투</span>' + encName(e.enc) + (e.lost ? ' <span class="dim">·</span> <span class="hurt num">체력 −' + e.lost + '</span>' : ' <span class="dim">· 피해 없음</span>') + ' <span class="dim num">· ' + e.sec + '초</span>';
      case 'offer': {
        const t = e.kind ? 'minion' : 'module';
        const opts = e.ids.map((v, i) => '<span class="opt' + (i === e.picked ? ' on' : '') + '">' + nm(t, v) + '</span>').join('<span class="sep"> / </span>');
        return '<span class="offer"><span class="k">' + (e.kind ? '하수인 보상' : '모듈 보상') + '</span>' + opts + (e.picked === undefined ? ' <span class="dim">(안 고름)</span>' : '') + '</span>';
      }
      case 'gain': case 'lose': return gainText(e);
      case 'event': return '<span class="k">이벤트</span>' + nm('event', e.id);
      case 'choice': return '<span class="k">선택</span><span class="num">(' + e.c + ')</span>';
      case 'evpick': return '<span class="k">이벤트에서 고름</span>' + (e.pot ? nm('potion', e.v) : nm('module', e.v));
      case 'shop': {
        if (e.cat === 5) return '<span class="k">상점</span>산 모듈 환불';
        const t = ['module', 'relic', 'minion', 'potion', 'module'][e.cat];
        return '<span class="k">상점 ' + D.SHOP[e.cat] + '</span>' + nm(t, e.id) + ' <span class="gold num">' + e.price + '골드</span>';
      }
      case 'camp': return '<span class="k">모닥불</span>' + (D.CAMP[e.c] || e.c);
      case 'potion': return '<span class="k">물약 사용</span>' + nm('potion', e.v);
      default: return '';
    }
  }

  /* 코드 확인 결과: 코드 칸 아래에 한 줄 요약 + 문제 있는 줄만 */
  function renderCheck(lines) {
    const st = $('code-st');
    if (!lines.length) { st.innerHTML = '<span class="bad">코드 줄을 찾지 못했습니다. 72글자 줄과 끝의 확인 글자가 함께 들어 있는지 확인하세요.</span>'; return; }
    const prob = lines.filter(l => l.status !== 'ok');
    const fixed = prob.filter(l => l.status === 'fixed').length, guess = prob.filter(l => l.status === 'guess').length, bad = prob.filter(l => l.status === 'bad').length;
    let h = lines.length + '줄 · ';
    if (!prob.length) h += '<span class="ok">모두 확인 글자가 맞습니다</span>';
    else h += [fixed ? '<span class="ok">' + fixed + '줄 고침</span>' : '', guess ? '<span class="warn">' + guess + '줄 확인 필요</span>' : '', bad ? '<span class="bad">' + bad + '줄 고치지 못함</span>' : ''].filter(Boolean).join(' · ');
    const rows = prob.filter(l => l.status !== 'fixed').map(l => '<span class="' + (l.status === 'bad' ? 'bad' : 'warn') + '">' + l.n + '번째 줄: ' + esc(l.note) + '</span>');
    st.innerHTML = '<span>' + h + '</span>' + rows.join('');
  }

  function render() {
    if (!src.value.trim()) {
      $('code-st').innerHTML = '';
      $('hero').innerHTML = '<p class="seed"><small>시드</small>—</p><p class="empty">스크린샷을 올리고 변환을 누르거나, 코드를 붙이고 코드 확인을 누르면 런 지도가 나옵니다.</p>';
      $('map').innerHTML = '';
      lastLog = '';
      return;
    }
    const res = D.decodeText(src.value, N);
    renderCheck(res.lines);
    lastLog = res.log.join('\n');
    const head = res.ev.find(e => e.type === 'head');
    named = !head || head.named;
    const m = renderMap(res.ev);
    $('map').innerHTML = m.html;
    if (!head) { $('hero').innerHTML = '<p class="empty">해독할 수 있는 줄이 없습니다.</p>'; return; }
    const lastRoom = [...res.ev].reverse().find(e => e.type === 'room');
    const f = [];
    f.push('<li>난이도 <b>' + head.diff + '</b></li>');
    if (lastRoom) f.push('<li>도달 <b>' + lastRoom.act + '막 ' + lastRoom.floor + '층</b></li>');
    if (m.end) {
      f.push('<li class="' + (m.end.ending ? 'win' : 'lose') + '">결과 <b>' + D.ENDING[m.end.ending] + '</b></li>');
      f.push('<li>점수 <b>' + m.end.score + '</b></li><li>처치 <b>' + m.end.kills + '</b></li>');
    }
    f.push('<li>기록 판 <b>' + head.ver + '</b></li>');
    $('hero').innerHTML = '<p class="seed"><small>시드</small>' + head.seed + '</p><ul class="facts">' + f.join('') + '</ul>' +
      (named ? '' : '<p class="example">이 기록은 판 ' + head.ver + '이라 지금 이름표(판 ' + N.version + ')와 번호가 달라 이름 없이 번호만 보여줍니다.</p>');
  }
  function setText(t) { src.value = t; render(); }
  $('btn-check').addEventListener('click', render);
  $('btn-clear').addEventListener('click', () => { setText(''); src.focus(); });
  $('btn-copy').addEventListener('click', () => {
    const done = m => { $('toast').textContent = m; setTimeout(() => { $('toast').textContent = ''; }, 2500); };
    if (!lastLog) { done('먼저 기록 코드를 붙여넣으세요.'); return; }
    const fallback = () => {
      const d = document.querySelector('details.raw'); if (d) d.open = true;
      const pre = document.querySelector('details.raw pre');
      if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      done('복사가 막혀 있어 글을 선택해 두었습니다. Ctrl+C로 복사하세요.');
    };
    try { navigator.clipboard.writeText(lastLog).then(() => done('복사했습니다. AI 대화창에 붙여넣으세요.'), fallback); } catch (e) { fallback(); }
  });
  /* ---------- 스크린샷 읽기 ---------- */
  const OCR = window.RunLogOcr, TPL = OCR.unpack(RUNLOG_OCR_TEMPLATES);
  const drop = $('drop'), ocrSt = $('ocr-status');
  let busy = false;
  async function toImageData(file) {
    const bmp = await createImageBitmap(file);
    const c = document.createElement('canvas');
    c.width = bmp.width; c.height = bmp.height; //원본 크기 그대로 (판독기 본이 화면 픽셀 크기에 맞춰져 있음)
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(bmp, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height);
    return { canvas: c, img: { w: c.width, h: c.height, data: d.data } };
  }
  const tick = () => new Promise(r => setTimeout(r, 0));
  async function readFiles(files) {
    files = [...files].filter(f => /^image\//.test(f.type));
    if (!files.length || busy) return;
    busy = true;
    const texts = [];
    let bad = 0;
    try {
      for (let fi = 0; fi < files.length; fi++) {
        const pre = files.length > 1 ? (fi + 1) + '쪽 ' : '';
        ocrSt.textContent = pre + '불러오는 중';
        await tick();
        const { img } = await toImageData(files[fi]);
        const { im, lines } = OCR.prepareImage(img);
        for (let li = 0; li < lines.length; li++) {
          ocrSt.textContent = pre + (li + 1) + '/' + lines.length + '줄 읽는 중';
          await tick();
          const r = OCR.readOne(im, lines[li], TPL);
          if (!r) continue;
          texts.push(r.text);
          if (r.fixed < 0) bad++;
        }
      }
      if (!texts.length) {
        ocrSt.textContent = '코드 줄을 찾지 못했습니다. 기록 보기 화면의 PC 스크린샷인지 확인하세요.';
      } else {
        ocrSt.textContent = texts.length + '줄 읽음' + (bad ? ' · ' + bad + '줄은 확인 글자가 맞지 않습니다. 아래 줄 검사에서 확인하세요.' : '');
        setText(texts.join('\n'));
      }
    } catch (e) {
      ocrSt.textContent = '사진을 읽지 못했습니다: ' + e.message;
    }
    busy = false;
  }
  /* 올린 사진 줄: 변환을 누를 때까지 모아 둠 */
  const queue = [];
  function addFiles(list) {
    const imgs = [...list].filter(f => /^image\//.test(f.type));
    for (const f of imgs) queue.push({ file: f, url: URL.createObjectURL(f) });
    if (imgs.length) ocrSt.textContent = '';
    drawQueue();
  }
  function drawQueue() {
    const box = $('thumbs');
    box.innerHTML = queue.length ? '' : '<div class="place">여기에 스크린샷을 놓으세요. 여러 장을 한꺼번에 놓아도 됩니다.</div>';
    queue.forEach((q, i) => {
      const el = document.createElement('div');
      el.className = 'thumb';
      el.innerHTML = '<div class="img"><img alt=""></div><div class="bar2"><span class="ord">' + (i + 1) + '쪽</span><span class="nm"></span>' +
        '<button type="button" data-a="l" aria-label="앞으로"' + (i ? '' : ' disabled') + '>←</button>' +
        '<button type="button" data-a="r" aria-label="뒤로"' + (i < queue.length - 1 ? '' : ' disabled') + '>→</button>' +
        '<button type="button" data-a="x">빼기</button></div>';
      el.querySelector('img').src = q.url;
      el.querySelector('.nm').textContent = q.file.name || '붙여넣은 사진';
      el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        if (busy) return;
        const a = b.dataset.a;
        if (a === 'x') { URL.revokeObjectURL(q.url); queue.splice(i, 1); }
        else { const j = a === 'l' ? i - 1 : i + 1; [queue[i], queue[j]] = [queue[j], queue[i]]; }
        drawQueue();
      }));
      box.appendChild(el);
    });
    $('btn-go').disabled = !queue.length || busy;
    $('btn-unq').disabled = !queue.length || busy;
    if (!queue.length && !ocrSt.textContent) ocrSt.textContent = '';
  }
  $('btn-go').addEventListener('click', async () => {
    if (!queue.length || busy) return;
    $('btn-go').disabled = $('btn-unq').disabled = true;
    await readFiles(queue.map(q => q.file));
    drawQueue();
  });
  $('btn-unq').addEventListener('click', () => { queue.splice(0).forEach(q => URL.revokeObjectURL(q.url)); ocrSt.textContent = ''; drawQueue(); });
  $('file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
  document.addEventListener('paste', e => {
    if (e.target === src) return; //코드 칸에 글을 붙일 때는 그대로
    const files = [...(e.clipboardData ? e.clipboardData.files : [])];
    if (files.length) { e.preventDefault(); addFiles(files); }
  });

  drawQueue();
  render();
})();
</script>
</body>
</html>
